# ============================================================
#  SENTINEL - Reglas de Alertas Optimizadas (Hybrid Cloud)
# ============================================================

groups:
  # ── Estado de Conectividad ──────────────────────────────────
  - name: connectivity
    rules:
      - alert: ServerOffline
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Servidor caído: {{ $labels.instance }}"
          description: "La instancia {{ $labels.instance }} no responde al monitoreo."

  # ── Recursos Locales (EC2) ──────────────────────────────────
  - name: host_resources
    rules:
      - alert: HostHighCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Carga crítica en {{ $labels.instance }}"
          description: "La CPU está al {{ $value | printf \"%.2f\" }}%."

      - alert: HostHighRAM
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Memoria agotándose en {{ $labels.instance }}"
          description: "RAM al {{ $value | printf \"%.2f\" }}%."

  # ── Alertas de AWS (Hybrid Monitoring) ─────────────────────
  - name: aws_alerts
    rules:
      - alert: RDSCPUUnusual
        expr: aws_rds_cpuutilization_average > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AWS RDS: Carga inusual"
          description: "La base de datos Sentinel-RDS ha superado el 80% de CPU."

      - alert: ALBLatencyHigh
        expr: avg(aws_applicationelb_target_response_time_average) > 1.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "AWS ALB: Latencia detectada"
          description: "El balanceador de carga está tardando más de 1.5s en responder."

  # ── Servicios de Aplicación ────────────────────────────────
  - name: app_services
    rules:
      - alert: WebServerDown
        expr: apache_up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "¡Servicio Apache Caído!"
          description: "El servidor de la tienda Psicopompo en {{ $labels.instance }} ha dejado de servir tráfico web."
