# ============================================================
#  SENTINEL - Alertmanager (Telegram + Email Integration)
#  Configurado para notificaciones en tiempo real
# ============================================================

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'instance', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  receiver: 'telegram-admin'

  routes:
    # Las alertas críticas van siempre a Telegram de forma inmediata
    - match:
        severity: critical
      receiver: 'telegram-admin'
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: 'telegram-admin'
    telegram_configs:
      - bot_token: '8054315854:AAHUDCRz0QyucnXoGQi-eai5eb3bY-6FEeI'
        chat_id: 8798461982
        send_resolved: true
        parse_mode: 'HTML'
        message: |
          {{ if eq .Status "firing" }}<b>🚨 ALERTA CRÍTICA EN SENTINEL</b>{{ else }}<b>✅ ALERTA RESUELTA</b>{{ end }}
          
          <b>Servicio:</b> {{ .CommonLabels.alertname }}
          <b>Severidad:</b> {{ .CommonLabels.severity | toUpper }}
          
          {{ range .Alerts }}
          📌 <b>Detalles:</b> {{ .Annotations.description }}
          🖥️ <b>Instancia:</b> {{ .Labels.instance }}
          ⏰ <b>Inicio:</b> {{ .StartsAt.Format "15:04:05" }}
          {{ end }}
          
          <i>-- Sentinel Monitoring System --</i>
